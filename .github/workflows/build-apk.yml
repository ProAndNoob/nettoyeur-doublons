name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compiler l'APK de test
        run: gradle :app:assembleDebug --no-daemon

      - name: Renommer l'APK avec le numéro de build
        run: cp app/build/outputs/apk/debug/app-debug.apk NettoyeurDoublons-build${{ github.run_number }}.apk

      - name: Publier l'APK dans une Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Nettoyeur de doublons (build ${{ github.run_number }})
          files: NettoyeurDoublons-build${{ github.run_number }}.apk

      - name: Déposer aussi l'APK comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: nettoyeur-doublons-apk
          path: NettoyeurDoublons-build${{ github.run_number }}.apk
